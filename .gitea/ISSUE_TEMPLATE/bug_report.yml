name: Bug report
about: Create a report to help us improve
title: ''
labels:
  - "status: needs triage"
  - "type: bug"
body:
  - type: checkboxes
    id: prereq
    attributes:
      label: Prerequisites
      options:
        - label: This issue is not a feature request or question. Use the [appropriate issue template](https://codeberg.org/Sparronator9999/YAMDCC/issues/new) for those issues.
        - label: I have searched the [issue tracker](https://codeberg.org/Sparronator9999/YAMDCC/issues?q=label:"type:+bug") for duplicate or similar bug reports.
        - label: I have not answered the above questions truthfully.
  - type: textarea
    id: bug_desc
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is
  - type: textarea
    id: reproduction_steps
    attributes:
      label: To Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected behaviour
      placeholder: A clear and concise description of what you expected to happen.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add any other context (including screenshots, logs, and crash reports) relating to the problem here. This will be automatically formatted into code, so no need for backticks (`).
